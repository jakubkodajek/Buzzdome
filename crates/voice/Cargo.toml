[package]
name = "voice"
description = "Reading questions aloud offline: the neural voice model (download check, unpacking), speech synthesis and the voice process's line protocol."
version.workspace = true
edition.workspace = true

[dependencies]
quiz-core = { path = "../quiz-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
# Checks the downloaded voice model against the hash written here (model.rs).
sha2 = "0.11"
# The voice model comes as a .tar.bz2 archive (model.rs).
bzip2 = "0.6"
tar = "0.4"
# Offline speech synthesis with the model, through ONNX Runtime; links the
# prebuilt static libraries (MT runtime on Windows, as Tauri builds the app).
sherpa-onnx = "2.0.1"
