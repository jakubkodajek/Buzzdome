[package]
name = "quiz-ai"
description = "Quiz writing for AI assistants: the quiz file's JSON Schema and the MCP server that AI apps write quizzes with."
version.workspace = true
edition.workspace = true

[dependencies]
quiz-core = { path = "../quiz-core" }
quiz-file = { path = "../quiz-file" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
# Pictures for the assistant to look at (mcp.rs).
base64 = "0.22"
# The quizmaster's documents, where assistants work unless they choose
# another folder (settings.rs), as the app names them.
dirs = "7"
# Codex's configuration, changed without losing its comments (assistants.rs).
toml_edit = "0.25"

[dev-dependencies]
# Quiz files made by hand for the workbench's tests.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
