# `cargo test` writes the TypeScript bindings of every `#[ts(export)]` type to
# app/src/bindings, so the UI never hand-copies a Rust type. CI fails when the
# committed bindings are stale.
[env]
TS_RS_EXPORT_DIR = { value = "app/src/bindings", relative = true }
# serde_json writes u64 as a plain number; timestamps stay far below 2^53.
TS_RS_LARGE_INT = "number"
