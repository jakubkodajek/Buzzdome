   sequence, a quiz file, a press order, a resumed old journal). If you
   cannot, drop it or mark confidence `low`.

## Rules
- Read-only. You may run tests and read-only commands.
- Do not report what clippy or ESLint already enforce.

## Output
Write `.work/<task-slug>/findings-code.md` and return the findings:

```
- id: CR-1
  severity: critical | major | minor | nit
  confidence: high | medium | low
  location: crates/quiz-core/src/game.rs:42
  problem: one sentence
  failure_scenario: concrete input -> wrong output / crash
  suggested_fix: one or two sentences
