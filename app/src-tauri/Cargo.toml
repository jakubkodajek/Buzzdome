[package]
name = "buzzdome"
description = "Buzzdome, a desktop quiz show with hardware buzzers"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which matters
# on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "buzzdome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quiz-core = { path = "../../crates/quiz-core" }
quiz-file = { path = "../../crates/quiz-file" }
buzzers = { path = "../../crates/buzzers", features = ["hidapi"] }
# protocol-asset serves the running quiz's media files to the windows.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
# Decodes the name of a file dropped into a window (an IPC header).
percent-encoding = "2"
# Lists the installed fonts for the editor's font picker.
fontdb = "0.23"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

# Read how much memory the sheet reader process holds, and on Windows cap it
# (sheet_reader.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
