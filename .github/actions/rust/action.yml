name: Rust
description: Installs the Rust release named in rust-toolchain.toml, the one place it is written.
inputs:
  components:
    description: Extra components, comma-separated.
    default: ""
  targets:
    description: Extra targets, comma-separated.
    default: ""
runs:
  using: composite
  steps:
    - id: release
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.release.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
