name: Linux libraries
description: Installs the system libraries the app builds against on Ubuntu, plus any extra packages.
inputs:
  extra:
    description: More packages, space-separated.
    default: ""
runs:
  using: composite
  steps:
    # hidapi (buzzer receiver) needs libudev; the rest is Tauri's WebKitGTK stack.
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev ${{ inputs.extra }}
