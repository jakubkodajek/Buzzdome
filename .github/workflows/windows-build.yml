name: Windows build

# Builds the Windows installer on every push and on demand. Download it from
# the run's "Artifacts" section.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the Rust workspace
        run: cargo test --workspace

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Type-check the UI
        working-directory: app
        run: npx tsc --noEmit

      - name: Build the installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-show-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/quiz-show.exe
          if-no-files-found: error
