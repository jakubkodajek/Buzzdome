name: E2E

# The real app driven through WebDriver (tauri-driver): a whole show,
# crashes and resumes, every Director and editor button (app/e2e). On Linux
# (WebKitWebDriver, a virtual display) and on Windows (msedgedriver with
# WebView2, as on the event laptop). macOS has no WebDriver for its web view.
# Called by build.yml on every push and by nightly.yml, which plays the
# suite several times over.
on:
  workflow_call:
    inputs:
      runs:
        description: How many times the whole suite runs.
        type: number
        default: 1

permissions:
  contents: read

env:
  # WebKitWebDriver, a virtual display, and xdotool for the system's file picker.
  E2E_DEPS: webkit2gtk-driver xvfb xdotool
  TAURI_DRIVER_VERSION: "2.1.0"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-deps
        with:
          extra: ${{ env.E2E_DEPS }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Type-check the tests
        working-directory: app
        run: npx tsc -p e2e/tsconfig.json

      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --debug --no-bundle

      - name: Run the E2E tests
        working-directory: app
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          for run in $(seq 1 "$RUNS"); do
            echo "::group::run $run of $RUNS"
            xvfb-run -a npm run e2e
            echo "::endgroup::"
          done

      # What each window showed when a test failed (app/e2e/setup.ts).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output-linux
          path: app/e2e-output
          if-no-files-found: ignore
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-windows

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$env:TAURI_DRIVER_VERSION"

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --debug --no-bundle

      # The tests use this machine's real app data folders, which is why they
      # run only on CI (app/e2e/harness.ts). The runner's msedgedriver
      # matches its Edge, whose engine WebView2 shares.
      - name: Run the E2E tests
        working-directory: app
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          $env:NATIVE_DRIVER = Join-Path $env:EDGEWEBDRIVER "msedgedriver.exe"
          for ($run = 1; $run -le [int]$env:RUNS; $run++) {
            Write-Output "::group::run $run of $env:RUNS"
            npm run e2e
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "::endgroup::"
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output-windows
          path: app/e2e-output
          if-no-files-found: ignore
          retention-days: 14
