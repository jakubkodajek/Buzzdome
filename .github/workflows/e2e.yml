name: E2E

# The real app driven through WebDriver (tauri-driver): a whole show,
# crashes and resumes, every Director and editor button (app/e2e). On Linux
# (WebKitWebDriver, a virtual display) and on Windows (msedgedriver with
# WebView2, as on the event laptop). macOS has no WebDriver for its web view.
# Called by build.yml on every push and by nightly.yml, which plays the
# suite several times over. Windows minutes cost more, so the Windows suite
# runs only where the caller asks for it.
on:
  workflow_call:
    inputs:
      runs:
        description: How many times the whole suite runs on Linux.
        type: number
        default: 1
      windows-runs:
        description: How many times the whole suite runs on Windows (0 skips it).
        type: number
        default: 0

permissions:
  contents: read

env:
  # WebKitWebDriver, a virtual display, and xdotool for the system's file picker.
  E2E_DEPS: webkit2gtk-driver xvfb xdotool
  TAURI_DRIVER_VERSION: "2.1.0"
  MSEDGEDRIVER_TOOL_REV: 8c4b34f51b45f5cf08013366d703de464ab871d1
  GSUDO_VERSION: "2.6.1"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-deps
        with:
          extra: ${{ env.E2E_DEPS }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Type-check the tests
        working-directory: app
        run: npx tsc -p e2e/tsconfig.json

      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --debug --no-bundle

      # The AI tests drive the quiz command line too (app/e2e/ai.e2e.ts).
      - name: Build the quiz command line
        run: cargo build -p quiz-ai --bin buzzdome-quiz

      - name: Run the E2E tests
        working-directory: app
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          for run in $(seq 1 "$RUNS"); do
            echo "::group::run $run of $RUNS"
            xvfb-run -a npm run e2e
            echo "::endgroup::"
          done

      # What each window showed when a test failed (app/e2e/setup.ts).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output-linux
          path: app/e2e-output
          if-no-files-found: ignore
          retention-days: 14

  windows:
    if: inputs.windows-runs > 0
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-windows

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version "$env:TAURI_DRIVER_VERSION"

      # The runner's own msedgedriver matches its Edge, which can drift from
      # the WebView2 runtime the app runs in. This tool (the one Tauri's
      # WebDriver CI guide uses) fetches the driver of the installed WebView2.
      - name: Install the msedgedriver that matches WebView2
        run: |
          cargo install --locked --git https://github.com/chippers/msedgedriver-tool --rev "$env:MSEDGEDRIVER_TOOL_REV"
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "msedgedriver")
          Push-Location $dir
          msedgedriver-tool
          Pop-Location
          Write-Output "runner's driver: $(& (Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe') --version)"
          Write-Output "WebView2's driver: $(& (Join-Path $dir 'msedgedriver.exe') --version)"
          "NATIVE_DRIVER=$(Join-Path $dir 'msedgedriver.exe')" >> $env:GITHUB_ENV

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run tauri build -- --debug --no-bundle

      # The AI tests drive the quiz command line too (app/e2e/ai.e2e.ts).
      - name: Build the quiz command line
        run: cargo build -p quiz-ai --bin buzzdome-quiz

      # GitHub's Windows runners run elevated, and an elevated WebView2 ignores
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, through which msedgedriver passes
      # its debugging port: no session starts ("DevToolsActivePort file doesn't
      # exist"; tauri-apps/wry#1782, MicrosoftEdge/WebView2Feedback#5645). So
      # the tests run at medium integrity through gsudo, as Tauri's own api-e2e
      # workflow does.
      - name: Install gsudo
        run: |
          winget install --id gerardog.gsudo --exact --version "$env:GSUDO_VERSION" --scope machine --accept-source-agreements --accept-package-agreements --disable-interactivity
          $bin = Join-Path $env:ProgramFiles "gsudo\Current"
          if (-not (Test-Path (Join-Path $bin "gsudo.exe"))) { throw "gsudo not found in $bin" }
          $bin >> $env:GITHUB_PATH
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" /T /Q
          icacls (Join-Path $env:RUNNER_TEMP "msedgedriver") /grant "Everyone:(OI)(CI)RX" /T /Q

      # The tests use this machine's real app data folders, which is why they
      # run only on CI (app/e2e/harness.ts). The unelevated process gets its
      # environment from a script, so nothing depends on gsudo passing it on.
      - name: Run the E2E tests
        working-directory: app
        env:
          RUNS: ${{ inputs.windows-runs }}
        run: |
          $script = Join-Path $env:RUNNER_TEMP "e2e-run.ps1"
          $vars = "PATH", "NATIVE_DRIVER", "GITHUB_ACTIONS", "RUNNER_ENVIRONMENT", "RUNS"
          $lines = $vars | ForEach-Object { "`$env:$_ = '$((Get-Item "env:$_").Value -replace "'", "''")'" }
          $lines += "Set-Location '$PWD'"
          $lines += @'
          for ($run = 1; $run -le [int]$env:RUNS; $run++) {
            Write-Output "::group::run $run of $env:RUNS"
            npm run e2e
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "::endgroup::"
          }
          '@
          Set-Content -Path $script -Value $lines
          icacls $script /grant "Everyone:RX" /Q
          gsudo --integrity Medium pwsh -NoProfile -NonInteractive -File $script
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output-windows
          path: app/e2e-output
          if-no-files-found: ignore
          retention-days: 14
