name: Nightly

# Non-stop checking between pushes: every night, 30 000 new
# random shows with up to 50 buzzers (crates/show-sim), 10 000 crash
# drills through the real show journal (app/src-tauri/src/crash_drill.rs),
# and the E2E suite several times over. Each night starts from new seeds; a
# failure names the seed (SOAK_SEED) that replays it. Also "Run workflow"
# in the Actions tab.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Seeds no earlier night played.
  SOAK_FIRST: ${{ github.run_number }}000000

jobs:
  soak:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly

      # Tauri embeds the built UI, so it must exist before the shell compiles.
      - name: Build the UI
        working-directory: app
        run: npm ci && npm run build

      - name: Random shows
        env:
          SOAK_SHOWS: "30000"
        run: cargo test --release -p show-sim -- --include-ignored

      - name: Crash drills
        env:
          SOAK_SHOWS: "10000"
        run: cargo test --release -p buzzdome crash_drill

  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      runs: 5
