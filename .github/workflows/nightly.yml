name: Nightly

# Non-stop checking between pushes: every night, 30 000 new
# random shows with up to 50 buzzers (crates/show-sim), 10 000 crash
# drills through the real show journal (app/src-tauri/src/crash_drill.rs),
# and the E2E suite several times over. Each night starts from new seeds; a
# failure names the seed (SOAK_SEED) that replays it. A scheduled night with
# no new commit on main is skipped, since runner minutes are paid. Also "Run
# workflow" in the Actions tab, which always runs.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Seeds no earlier night played.
  SOAK_FIRST: ${{ github.run_number }}000000

jobs:
  # Whether main changed since the last scheduled night.
  changed:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 50

      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit on main in the last 25 hours; skipping the night."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  soak:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly

      # Tauri embeds the built UI, so it must exist before the shell compiles.
      - name: Build the UI
        working-directory: app
        run: npm ci && npm run build

      - name: Random shows
        env:
          SOAK_SHOWS: "30000"
        run: cargo test --release -p show-sim -- --include-ignored

      - name: Crash drills
        env:
          SOAK_SHOWS: "10000"
        run: cargo test --release -p buzzdome crash_drill

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      runs: 5
      windows-runs: 1
