[workspace]
members = ["crates/quiz-core", "crates/quiz-file", "crates/buzzers", "crates/lights", "crates/show-sim", "crates/quiz-ai", "app/src-tauri"]
resolver = "2"

[workspace.package]
# The crates' version. The app's own, which releases raise and updates
# compare, is `version` in app/src-tauri/tauri.conf.json.
version = "0.2.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TypeScript bindings for the UI, written by `cargo test` (see .cargo/config.toml).
ts-rs = "12"
# JSON Schema of the quiz file, for AI assistants and other writers (crates/quiz-ai).
schemars = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
